<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator Promo</title>
    <link rel="stylesheet" href="src/style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    
    <div class="container">
        <div class="card-container">

            <div class="card" style="background-image: url(src/image/image\ 1.png); background-size: cover;">

                <div class="card-content">
                    <h1>Craft Your</h1>
                    <h5>Imaginary Escape</h5>
                    <p>The leading AI art generation and image editing tool with 3.5B+ creations.</p>
                </div>

                <div class="badge">
                    <div class="badge_dot"><i class="ri-circle-fill"></i></div>
                    <p>New-Instagram Reels Creator</p>
                </div>

                

                <div class="btn">
                    <button class="btn-action">Generate Image</button>
                </div>

            </div>
        </div>
        
        <div class="card-container">

            <div class="card-2">

                <div class="img-card">
                    <img src="src/image/image 1.png" alt="image_card">
                </div>

                <div class="card-content-2">
                    <h1>Craft Your</h1>
                    <h5>Imaginary Escape</h5>
                    <p>The leading AI art generation and image editing tool with 3.5B+ creations.</p>
                </div>

                <div class="badge">
                    <div class="badge_dot"><i class="ri-circle-fill"></i></div>
                    <p>New-Instagram Reels Creator</p>
                </div>

                

                <div class="btn-2">
                    <button class="btn-action">Generate Image</button>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
